<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071810" />
    <meta name="description" content="A tiny glowing fairy soundboard for your own Hey! Listen! audio clip." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/fairy-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Hey! Listen!</title>
  </head>
  <body>
    <div class="forest" aria-hidden="true">
      <span class="mote mote-a"></span><span class="mote mote-b"></span>
      <span class="mote mote-c"></span><span class="mote mote-d"></span>
      <span class="mote mote-e"></span><span class="mote mote-f"></span>
    </div>

    <main class="shell">
      <header class="brand">
        <span class="eyebrow">POCKET FAIRY</span>
        <h1>Hey! <em>Listen!</em></h1>
        <p>Your tiny call for attention, one tap away.</p>
      </header>

      <section class="soundboard" aria-label="Soundboard">
        <div class="orbit" aria-hidden="true">
          <span class="orbit-dot"></span>
        </div>
        <button class="fairy-button" id="playButton" type="button" aria-label="Play your Hey Listen sound">
          <span class="wing wing-left"></span>
          <span class="wing wing-right"></span>
          <span class="fairy-core"></span>
          <span class="button-label">TAP</span>
        </button>
        <p class="status" id="status" role="status" aria-live="polite">Loading included soundbite…</p>
      </section>

      <section class="controls" aria-label="Sound settings">
        <div class="control-copy">
          <strong>Choose your sound</strong>
          <span>Built-in + local, available offline.</span>
        </div>
        <label class="file-button" for="audioPicker">Add local audio</label>
        <input id="audioPicker" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg" multiple />
        <label class="select-wrap" for="soundSelect">
          <span>Sound library</span>
          <select id="soundSelect">
            <option value="native:hey-listen">Hey! Listen! — built in</option>
            <option value="demo">Demo chime</option>
          </select>
        </label>
      </section>

      <button class="install-button" id="installButton" type="button" hidden>
        <span aria-hidden="true">↓</span> Add to home screen
      </button>

      <footer>
        <span>Made for adventurers</span>
        <span class="footer-mark" aria-hidden="true">✦</span>
        <span>Unofficial fan-made tool</span>
      </footer>
    </main>

    <audio id="audioPlayer" preload="auto"></audio>
    <script src="./app.js" defer></script>
  </body>
</html>
